name: Atlas commercial verification
on:
  push:
    branches: ['feat/**']
  pull_request:
    branches: [main, 'feat/**', desktop-v0.1.1]
permissions:
  contents: read
concurrency:
  group: commercial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-and-server:
    runs-on: ubuntu-latest
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm --prefix server ci
      - run: npx playwright install --with-deps chrome
      - run: npm --prefix server test
      - run: npm run test:premium-db && npm run test:sharing-db && node tests/wishlist-reconcile.unit.mjs
      - run: npm test -- --workers=2 --timeout=90000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: commercial-web-diagnostics
          path: test-results/
          retention-days: 7
  mac:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm --prefix desktop ci
      - run: npm run desktop:prepare
      - run: npm run test:desktop -- --timeout=90000
      - name: Testar perfil da versão distribuída 0.1.1 e rollback
        env:
          ATLAS_LEGACY_EXECUTABLE: ${{ runner.temp }}/Atlas-legacy/Atlas Pessoal.app/Contents/MacOS/Atlas Pessoal
        run: |
          curl -fsSL --retry 3 https://github.com/murilomelo22/atlas/releases/download/desktop-v0.1.1/Atlas-Pessoal-0.1.1-universal.zip -o "$RUNNER_TEMP/Atlas-legacy.zip"
          ditto -x -k "$RUNNER_TEMP/Atlas-legacy.zip" "$RUNNER_TEMP/Atlas-legacy"
          npm run test:desktop -- --grep 'migra perfil real'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: commercial-mac-diagnostics
          path: test-results/
          retention-days: 7
